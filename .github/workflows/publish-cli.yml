name: publish-cli

# Tag-routed publish workflow per BK-237.
# Each package has its own tag prefix; only the matching job runs.
#
# Tag conventions:
#   v*                  -> sdtk-spec-kit    (preserves legacy convention)
#   sdtk-design-v*      -> sdtk-design-kit
#   sdtk-code-v*        -> sdtk-code-kit
#   sdtk-ops-v*         -> sdtk-ops-kit
#   sdtk-wiki-v*        -> sdtk-wiki-kit
#   sdtk-agent-v*       -> sdtk-agent-kit
#   sdtk-kit-v*         -> sdtk-kit         (meta-package, added in BK-238)
#
# All jobs use release-mode gates from BK-236:
#   scripts/ci/run-release-gates.ps1 -Package <name>

on:
  push:
    tags:
      - "v*"
      - "sdtk-design-v*"
      - "sdtk-code-v*"
      - "sdtk-ops-v*"
      - "sdtk-wiki-v*"
      - "sdtk-agent-v*"
      - "sdtk-kit-v*"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # sdtk-spec-kit
  # ---------------------------------------------------------------------------
  publish-spec:
    if: startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'sdtk-')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: products/sdtk-spec/distribution/sdtk-spec-kit

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "18"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Sync toolkit payload
        run: powershell -ExecutionPolicy Bypass -File scripts/sync-toolkit-assets.ps1

      - name: Build payload manifest
        run: powershell -ExecutionPolicy Bypass -File scripts/build-toolkit-manifest.ps1

      - name: Verify payload integrity
        run: node -e "require('./src/lib/toolkit-payload').verify()"

      - name: Run release gates
        run: powershell -ExecutionPolicy Bypass -File ..\\..\\..\\..\\scripts\\ci\\run-release-gates.ps1 -Package sdtk-spec-kit

      - name: Verify version matches tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version verified: $PKG_VERSION"

      - name: npm pack
        run: npm pack

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload .tgz to GitHub Release (idempotent)
        shell: bash
        run: |
          TGZ_FILE=$(ls sdtk-spec-kit-*.tgz)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists. Uploading asset with --clobber."
            gh release upload "$GITHUB_REF_NAME" "$TGZ_FILE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$TGZ_FILE" \
              --title "sdtk-spec-kit $GITHUB_REF_NAME" \
              --notes "Install: \`npm i -g sdtk-spec-kit\`

            Or from tarball:
            \`\`\`
            npm i -g https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$TGZ_FILE
            \`\`\`"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

